<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C22"/><stop offset="1" stop-color="#05050E"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14F195"/><stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#14F195" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- Ball seams: the two arcs a baseball or a football both read as, kept wide
       and low-contrast so they frame the mark instead of competing with it. -->
  <g fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="13" stroke-linecap="round">
    <path d="M92 66 C 24 176, 24 336, 92 446"/>
    <path d="M420 66 C 488 176, 488 336, 420 446"/>
  </g>
  <g fill="none" stroke="#14F195" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"
     stroke-dasharray="2 26">
    <path d="M118 78 C 56 182, 56 330, 118 434"/>
    <path d="M394 78 C 456 182, 456 330, 394 434"/>
  </g>

  <!-- "AI" drawn as geometry, not type: no font to load, no hinting to differ,
       identical at 1024px and at 40px on a home screen. -->
  <g fill="url(#ink)">
    <path fill-rule="evenodd"
          d="M144 346 L204 166 L234 166 L294 346 L254 346 L242 308 L196 308 L184 346 Z
             M219 212 L232 274 L206 274 Z"/>
    <rect x="324" y="166" width="44" height="180" rx="6"/>
  </g>
</svg>
