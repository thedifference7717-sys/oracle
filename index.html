<html lang="en">
<head>

<style>
:root{--bg:#050510;--bg2:#08081A;--bg3:#0D0D20;--border:#1A1A35;--text:#F0F0FF;--muted:#B4BCC8;--dim:#8C95A4;--green:#14F195;--red:#FF4D6D;--yellow:#FBBF24;--blue:#60A5FA;--orange:#F7931A;--purple:#A78BFA}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100%}
body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
#topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0A1A16,#070714);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;letter-spacing:.04em;color:#D6FFE9;text-shadow:0 0 14px #14F19566}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:.12em;margin-top:3px}
.controls{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap;margin-left:auto}
.navlink{align-self:flex-end;padding:11px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:700;font-family:'Orbitron',monospace;text-decoration:none}
.run-btn{padding:11px 18px;background:linear-gradient(90deg,#14F195,#60A5FA);border:none;border-radius:8px;color:#04120b;font-size:13px;font-weight:700;letter-spacing:.06em;font-family:'Orbitron',monospace;cursor:pointer}
.run-btn:disabled{opacity:.5;cursor:wait}
#progress-wrap{height:3px;background:var(--bg2);display:none}#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#14F195,var(--blue));transition:width .2s}
#status{font-size:13px;color:var(--blue);padding:11px 18px;min-height:18px;border-bottom:1px solid var(--border);background:var(--bg2)}
.section-h{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);padding:16px 18px 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:0 18px}
@media(max-width:900px){.cards{grid-template-columns:1fr}}
.bet{background:linear-gradient(160deg,#0C1A14,var(--bg2));border:1px solid #14F19555;border-radius:16px;padding:16px;box-shadow:0 4px 24px #14F19514}
.bet.r1{border-color:#14F195AA;box-shadow:0 4px 28px #14F19533}
.bet.r2{border-color:#60A5FA88}
.bet.r3{border-color:#A78BFA88}
.bet-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.bet-rank{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;padding:5px 10px;border-radius:8px;background:#14F19522;color:var(--green);white-space:nowrap}
.bet.r2 .bet-rank{background:#60A5FA22;color:var(--blue)}
.bet.r3 .bet-rank{background:#A78BFA22;color:var(--purple)}
.bet-game{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.bet-str{text-align:right}
.bet-str .v{font-family:'Orbitron',monospace;font-size:26px;font-weight:900;color:var(--green);line-height:1}
.bet-str .l{font-size:9px;color:var(--muted);letter-spacing:.06em}
.leg{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.leg-av{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--text);width:52px;text-align:center}
.leg-info{flex:1;min-width:0}
.leg-name{font-size:16px;font-weight:700;line-height:1.1}
.leg-meta{font-size:11px;color:var(--muted);margin-top:3px}
.trend-up{color:var(--green)}.trend-dn{color:var(--red)}.trend-fl{color:var(--dim)}
.leg-prob{text-align:right;font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--blue)}
.bet-foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.odds{font-family:'Orbitron',monospace;color:var(--yellow);font-weight:700}
.wrap{padding:14px 18px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.panel-head{padding:12px 15px;border-bottom:1px solid var(--border);font-family:'Orbitron',monospace;font-size:12px;color:var(--blue);letter-spacing:.05em}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
thead th{position:sticky;top:0;background:#0A0A1C;text-align:left;padding:11px 12px;font-size:11px;color:var(--muted);font-weight:400;border-bottom:1px solid var(--border);white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--border)}
td.num{text-align:right;font-family:'Orbitron',monospace}
.legend{font-size:12px;color:var(--muted);line-height:1.8;padding:12px 18px 0}
.spin{display:inline-block;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px 18px;text-align:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="topbar">
  <div><div class="logo">🎲 DAIly Double</div><div class="logo-sub">2-MAN SAME-GAME HIT PARLAY · BUILD 1</div></div>
  <div class="controls">
    <a class="navlink" href="hr.html">⚾ HR</a>
    <a class="navlink" href="hits.html">🎯 AIchiro</a>
    <a class="navlink" href="backtest.html">📊 Backtest</a>
    <button class="run-btn" id="run" onclick="load()">⟳ REFRESH</button>
  </div>
</div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="status"></div>

<div class="section-h">🎲 TOP 3 DOUBLES — two hitters, one game, both to record a hit · ranked by combined probability</div>
<div class="cards" id="cards"></div>

<div class="wrap">
  <div class="panel">
    <div class="panel-head">📋 BEST PAIR IN EVERY GAME TODAY</div>
    <div class="table-wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </div>
</div>
<div class="legend" id="legend"></div>

<script>
const API="https://statsapi.mlb.com/api/v1";
const SOURCES=[u=>u,u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://thingproxy.freeboard.io/fetch/"+u];
let good=null;let current=[];
async function getJSON(url){const order=good!=null?[good,...SOURCES.map((_,i)=>i).filter(i=>i!==good)]:SOURCES.map((_,i)=>i);let e;for(const i of order){try{const r=await fetch(SOURCES[i](url),{headers:{Accept:"application/json"}});if(!r.ok)throw 0;const j=await r.json();good=i;return j;}catch(x){e=x;}}throw e||new Error("unreachable");}
async function pool(items,fn,size,onTick){const out=new Array(items.length);let i=0,done=0;const w=async()=>{while(i<items.length){const j=i++;try{out[j]=await fn(items[j]);}catch(e){out[j]=null;}done++;onTick&&onTick(done,items.length);}};await Promise.all(Array.from({length:Math.min(size,items.length||1)},w));return out;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function etNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function slateYmd(){const d=etNow();d.setHours(d.getHours()-6);return ymd(d);}
function status(m,c="var(--blue)"){const el=document.getElementById("status");el.style.color=c;el.innerHTML=m;}
function setProg(p){const w=document.getElementById("progress-wrap"),b=document.getElementById("progress-bar");if(p>0&&p<100){w.style.display="block";b.style.width=p+"%";}else{w.style.display="none";b.style.width="0%";}}
// Ballpark HITS factor (100 = neutral; >100 = more hits fall in)
const PARK={"Coors Field":112,"Fenway Park":107,"Great American Ball Park":102,"Globe Life Field":101,"Chase Field":103,"Wrigley Field":101,"Yankee Stadium":101,"Citizens Bank Park":101,"Oriole Park at Camden Yards":100,"Rogers Centre":101,"American Family Field":100,"Truist Park":100,"Kauffman Stadium":103,"Daikin Park":100,"Minute Maid Park":100,"Nationals Park":100,"Dodger Stadium":99,"Angel Stadium":100,"Busch Stadium":99,"Target Field":99,"Progressive Field":99,"Rate Field":100,"PNC Park":100,"Comerica Park":101,"Citi Field":98,"Petco Park":97,"loanDepot park":98,"T-Mobile Park":96,"Oracle Park":98,"Sutter Health Park":101,"George M. Steinbrenner Field":100};
function park(n){if(!n)return 100;if(PARK[n]!=null)return PARK[n];const k=Object.keys(PARK).find(k=>n.includes(k)||k.includes(n));return k?PARK[k]:100;}
function platoon(bat,pit){if(!bat||!pit)return null;if(bat==="S")return "adv";return bat!==pit?"adv":"dis";}
// American odds from a probability
function amOdds(p){if(!(p>0&&p<1))return "—";const dec=1/p;return dec>=2?"+"+Math.round((dec-1)*100):"-"+Math.round(100/(dec-1));}

// Probability a hitter records ≥1 hit in a game, blending his bat, the pitcher's
// hits-allowed, contact rate, platoon edge, and ballpark.
function hitProb(seasonAVG,recentAVG,rab,spBAA,kRate,plt,pk){
  const own = rab>=15 ? 0.55*seasonAVG + 0.45*recentAVG : seasonAVG;
  const pit = spBAA!=null ? spBAA : 0.250;
  let x = 0.62*own + 0.38*pit;                       // hitter vs pitcher-allowed
  if(kRate!=null) x *= clamp(1 + (0.22 - kRate)*0.6, 0.90, 1.10); // contact bonus for low-K bats
  if(plt==="adv") x *= 1.05; else if(plt==="dis") x *= 0.96;      // platoon edge
  x *= (0.99 + (pk-100)/100*0.2);                    // small park nudge
  x = clamp(x, 0.15, 0.44);
  return 1 - Math.pow(1 - x, 3.9);                    // ~3.9 at-bats
}

async function load(){
  const btn=document.getElementById("run");btn.disabled=true;
  try{
    const day=slateYmd(),season=+day.slice(0,4);
    const rEnd=etNow();rEnd.setDate(rEnd.getDate()-1);const rStart=etNow();rStart.setDate(rStart.getDate()-14);
    const rEndStr=ymd(rEnd),rStartStr=ymd(rStart);
    status('<span class="spin">⟳</span> Today’s schedule…');setProg(6);
    const sched=await getJSON(`${API}/schedule?sportId=1&date=${day}&hydrate=probablePitcher,team,venue`);
    let games=(sched?.dates?.[0]?.games||[]).filter(g=>!/postpon|suspend|cancel/i.test(g.status?.detailedState||""));
    if(!games.length){status(`No MLB games today (${day}).`,"var(--yellow)");renderEmpty();return;}
    const G=games.map(g=>({pk:g.gamePk,venue:g.venue?.name,park:park(g.venue?.name),
      home:{id:g.teams.home.team.id,name:g.teams.home.team.abbreviation||g.teams.home.team.name,sp:g.teams.away.probablePitcher,},
      away:{id:g.teams.away.team.id,name:g.teams.away.team.abbreviation||g.teams.away.team.name,sp:g.teams.home.probablePitcher,}}));
    // NOTE: a team's opposing SP is the OTHER team's probable pitcher.

    status('<span class="spin">⟳</span> Active rosters…');setProg(16);
    const teamIds=[...new Set(G.flatMap(g=>[g.home.id,g.away.id]))];
    const rosterByTeam={};
    await pool(teamIds,async tid=>{try{const d=await getJSON(`${API}/teams/${tid}/roster?rosterType=active`);rosterByTeam[tid]=(d?.roster||[]).filter(p=>p.position?.type!=="Pitcher").map(p=>({id:p.person.id,name:p.person.fullName,pos:p.position?.abbreviation}));}catch(e){rosterByTeam[tid]=[];}},6);

    status('<span class="spin">⟳</span> Season + last-14-day hitting…');setProg(30);
    const [seasonD,recentD]=await Promise.all([
      getJSON(`${API}/stats?stats=season&group=hitting&season=${season}&sportId=1&limit=3000&gameType=R&playerPool=All`),
      getJSON(`${API}/stats?stats=byDateRange&group=hitting&startDate=${rStartStr}&endDate=${rEndStr}&sportId=1&limit=3000&gameType=R&playerPool=All`)
    ]);
    const seasonById={},recentById={};
    (seasonD?.stats?.[0]?.splits||[]).forEach(s=>{if(s.player?.id!=null)seasonById[s.player.id]={avg:parseFloat(s.stat?.avg)||0,ab:+s.stat?.atBats||0,k:+s.stat?.strikeOuts||0,pa:+s.stat?.plateAppearances||0};});
    (recentD?.stats?.[0]?.splits||[]).forEach(s=>{if(s.player?.id!=null)recentById[s.player.id]={ravg:parseFloat(s.stat?.avg)||0,rab:+s.stat?.atBats||0};});

    // Build candidate hitters per game (regulars, not injured — active roster only)
    status('<span class="spin">⟳</span> Building candidates…');setProg(46);
    const cand=[]; // {id,name,pos,teamId,teamName,oppSP,g}
    G.forEach(g=>{
      [["home",g.home,g.away],["away",g.away,g.home]].forEach(([side,team,opp])=>{
        (rosterByTeam[team.id]||[]).forEach(pl=>{
          const ss=seasonById[pl.id];if(!ss)return;
          if(ss.ab<120||ss.avg<0.250)return;                 // regulars with a real bat
          const rr=recentById[pl.id]||{ravg:ss.avg,rab:0};
          cand.push({id:pl.id,name:pl.name,pos:pl.pos,teamId:team.id,teamName:team.name,opp:opp.name,
            oppSP:team.sp,gk:g.pk,park:g.park,venue:g.venue,
            avg:ss.avg,ab:ss.ab,krate:ss.pa>0?ss.k/ss.pa:null,ravg:rr.ravg,rab:rr.rab});
        });
      });
    });
    if(!cand.length){status(`No qualifying regulars in today’s games.`,"var(--yellow)");renderEmpty();return;}

    // Opposing-SP hits-allowed (BAA) from game logs, and batter/pitcher hands
    status('<span class="spin">⟳</span> Pitching matchups…');setProg(60);
    const spIds=[...new Set(cand.map(c=>c.oppSP?.id).filter(Boolean))];const baaMap={},handMap={};
    await pool(spIds,async pid=>{try{const d=await getJSON(`${API}/people/${pid}/stats?stats=gameLog&group=pitching&season=${season}&gameType=R`);let h=0,ab=0;(d?.stats?.[0]?.splits||[]).forEach(x=>{if(x.stat&&x.date&&x.date<=rEndStr){h+=(+x.stat.hits||0);ab+=(+x.stat.atBats||0);}});baaMap[pid]=ab>=40?h/ab:null;}catch(e){baaMap[pid]=null;}},6,(d,t)=>setProg(60+Math.round(d/t*18)));
    const ids=[...new Set([...cand.map(c=>c.id),...spIds])];
    for(let i=0;i<ids.length;i+=40){try{const d=await getJSON(`${API}/people?personIds=${ids.slice(i,i+40).join(",")}`);(d.people||[]).forEach(p=>handMap[p.id]={bat:p.batSide?.code,pit:p.pitchHand?.code});}catch(e){}}
    setProg(82);

    // Score every candidate
    cand.forEach(c=>{const spid=c.oppSP?.id;c.baa=spid!=null?baaMap[spid]:null;
      const plt=platoon(handMap[c.id]?.bat, spid!=null?handMap[spid]?.pit:null);
      c.plt=plt;c.trend=c.ravg-c.avg;
      c.p=hitProb(c.avg,c.ravg,c.rab,c.baa,c.krate,plt,c.park);});

    // Best pair per game = the two highest hit-probability hitters in that game
    const byGame={};cand.forEach(c=>{(byGame[c.gk]=byGame[c.gk]||[]).push(c);});
    let pairs=Object.values(byGame).map(list=>{
      list.sort((a,b)=>b.p-a.p);
      if(list.length<2)return null;
      const a=list[0],b=list[1];
      return {a,b,prob:a.p*b.p,gk:a.gk,venue:a.venue,park:a.park};
    }).filter(Boolean);
    pairs.sort((x,y)=>y.prob-x.prob);
    current=pairs;

    setProg(100);setTimeout(()=>setProg(0),300);
    render(pairs);
    status(`✓ ${pairs.length} games analyzed · ${cand.length} regulars · ${day} · ${new Date().toLocaleTimeString()}`,"var(--green)");
  }catch(e){status(`✗ ${e.message}. Feed may be blocked — try again.`,"var(--red)");setProg(0);}
  finally{btn.disabled=false;}
}

function renderEmpty(){document.getElementById("cards").innerHTML="";document.getElementById("tbody").innerHTML=`<tr><td colspan="7"><div class="empty">No games / eligible hitters right now.</div></td></tr>`;}

function leg(c){
  const tr=c.trend>=0.020?`<span class="trend-up">▲ ${(c.ravg).toFixed(3).replace(/^0/,"")} L14</span>`:c.trend<=-0.020?`<span class="trend-dn">▼ ${(c.ravg).toFixed(3).replace(/^0/,"")} L14</span>`:`<span class="trend-fl">${(c.ravg).toFixed(3).replace(/^0/,"")} L14</span>`;
  const spTxt=c.oppSP?.fullName?`vs ${c.oppSP.fullName}${c.baa!=null?" ("+c.baa.toFixed(3).replace(/^0/,"")+")":""}`:"vs SP TBD";
  const pl=c.plt==="adv"?' · <span class="trend-up">▲PLAT</span>':c.plt==="dis"?' · <span class="trend-dn">▽</span>':'';
  return `<div class="leg">
    <div class="leg-av">${c.avg.toFixed(3).replace(/^0/,"")}</div>
    <div class="leg-info"><div class="leg-name">${c.name}</div><div class="leg-meta">${c.teamName} · ${c.pos||""} · ${tr}${pl}<br>${spTxt}</div></div>
    <div class="leg-prob">${Math.round(c.p*100)}%</div>
  </div>`;
}

function render(pairs){
  const top=pairs.slice(0,3);
  document.getElementById("cards").innerHTML=top.map((pr,i)=>`
    <div class="bet r${i+1}">
      <div class="bet-top">
        <div class="bet-rank">${["#1 STRONGEST","#2","#3"][i]}</div>
        <div class="bet-game">${pr.a.teamName} vs ${pr.a.opp}<br><span style="color:var(--dim)">${pr.venue||""}</span></div>
        <div class="bet-str"><div class="v">${Math.round(pr.prob*100)}</div><div class="l">STRENGTH</div></div>
      </div>
      ${leg(pr.a)}
      ${leg(pr.b)}
      <div class="bet-foot"><span>Both to record a hit</span><span>true odds ≈ <span class="odds">${amOdds(pr.prob)}</span></span></div>
    </div>`).join("")||'<div class="empty">No pairs available.</div>';

  document.getElementById("thead").innerHTML=["#","GAME","HITTER 1","HITTER 2","P1","P2","BOTH"].map((h,i)=>`<th class="${[4,5,6].includes(i)?'num':''}">${h}</th>`).join("");
  document.getElementById("tbody").innerHTML=pairs.map((pr,i)=>`
    <tr>
      <td class="num" style="color:var(--dim)">${i+1}</td>
      <td style="font-size:12px">${pr.a.teamName} v ${pr.a.opp}</td>
      <td><div style="font-weight:700">${pr.a.name}</div><div style="color:var(--dim);font-size:10px">${pr.a.avg.toFixed(3).replace(/^0/,"")} · ${pr.a.oppSP?.fullName||"TBD"}</div></td>
      <td><div style="font-weight:700">${pr.b.name}</div><div style="color:var(--dim);font-size:10px">${pr.b.avg.toFixed(3).replace(/^0/,"")} · ${pr.b.oppSP?.fullName||"TBD"}</div></td>
      <td class="num" style="color:var(--blue)">${Math.round(pr.a.p*100)}%</td>
      <td class="num" style="color:var(--blue)">${Math.round(pr.b.p*100)}%</td>
      <td class="num"><b style="color:${pr.prob>=0.55?'var(--green)':pr.prob>=0.48?'var(--yellow)':'var(--muted)'}">${Math.round(pr.prob*100)}</b></td>
    </tr>`).join("");

  document.getElementById("legend").innerHTML=`<b>STRENGTH</b> = combined probability both hitters record ≥ 1 hit (P1 × P2, shown 0–100). Each hitter's hit probability blends: season AVG + last-14-day form (55/45), the opposing starter's hits-allowed BAA (38%), strikeout rate (low-K = more contact), platoon edge (bat vs pitcher hand), and a ballpark hits factor — over ~3.9 at-bats. Filters: active roster only (injured excluded), season ≥ 120 AB and ≥ .250 AVG, real probable starter. <b>▲/▼ L14</b> = trending up/down vs season · <b>▲PLAT</b> = platoon advantage. ⚠ Model estimate — not betting advice.`;
}

load();
setInterval(load,180000); // refresh every 3 min
</script>
</body>
</html>
