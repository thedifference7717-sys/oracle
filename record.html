<style>
/* Same design system as the board — see index.html. System stack instead of
   webfonts, tabular figures instead of a monospace face, Apple's dark palette,
   hairline separators, and colour used only where it carries meaning. Every
   class name the render code emits is unchanged. */
:root{
  --bg:#000;--bg2:#1C1C1E;--bg3:#2C2C2E;--elev:#1C1C1E;
  --border:rgba(84,84,88,.6);--hair:rgba(84,84,88,.35);
  --text:#FFF;--muted:rgba(235,235,245,.6);--dim:rgba(235,235,245,.35);
  --green:#30D158;--red:#FF453A;--yellow:#FFD60A;--blue:#0A84FF;--purple:#BF5AF2;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --pad:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--sys);
  -webkit-font-smoothing:antialiased;min-height:100%;font-size:15px;line-height:1.5}
body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 56px)}
b,strong{font-weight:600}

#topbar{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--border);
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--pad) 12px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--purple);margin-bottom:1px}
.logo{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-sub{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
#buildsha{color:var(--dim);font-family:var(--num);font-size:10px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.navlink{padding:8px 13px;background:var(--bg3);border:none;border-radius:980px;color:var(--text);
  font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.navlink:active{opacity:.6}

.wrap{padding:18px var(--pad) 0}
.group-h{padding:36px 0 12px;border-top:.5px solid var(--hair);margin-top:30px}
.group-h span{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
.group-h small{display:block;font-size:12px;color:var(--dim);margin-top:4px;opacity:.75;line-height:1.5}
.mini{width:100%;min-width:0;margin:10px 0 4px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:8px 6px;border-bottom:.5px solid var(--hair);white-space:nowrap}
.mini th{font-size:11px;color:var(--dim);font-weight:500}
.mini .num{text-align:right}
.mini td{padding:6px 8px;border-bottom:.5px solid var(--hair);white-space:nowrap}
.mini tr:last-child td{border-bottom:none}
.note code{font-family:var(--num);font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:5px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--elev);border:none;border-radius:16px;padding:16px 14px;text-align:center}
.stat .v{font-size:27px;font-weight:700;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.35}

.verdict{margin-top:14px;padding:15px 16px;border-radius:14px;border:none;
  background:rgba(255,214,10,.12);color:#FFE66B;font-size:13px;line-height:1.62}
.verdict.good{background:rgba(48,209,88,.14);color:#7BE89A}
.verdict b{font-weight:600;color:#fff}
.verdict.good b{color:#fff}

.note{margin-top:14px;padding:15px 16px;border:none;background:var(--elev);border-radius:16px;
  font-size:13px;color:var(--muted);line-height:1.62}
.note b{color:var(--text);font-weight:600}
.note a{color:var(--blue);text-decoration:none}
.note.era{background:rgba(48,209,88,.12);color:rgba(220,255,230,.85)}
.note.era b{color:#fff}

/* disclosure, matching the board */
.disc{margin-top:14px;background:var(--elev);border-radius:16px;overflow:hidden}
.disc>summary{list-style:none;cursor:pointer;padding:15px 30px 15px 16px;position:relative;display:block;
  font-size:15px;color:var(--text);font-weight:600}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;
  border-right:1.8px solid var(--dim);border-bottom:1.8px solid var(--dim);
  transform:translateY(-70%) rotate(45deg);transition:transform .2s ease}
.disc[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
.disc[open]>summary{border-bottom:.5px solid var(--hair)}
.disc>summary:active{opacity:.6}
.disc-b{padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.62}
.disc-b b{color:var(--text);font-weight:600}
.disc-b a{color:var(--blue);text-decoration:none}
.disc-b p+p{margin-top:11px}

.panel{background:var(--elev);border:none;border-radius:16px;overflow:hidden;margin-top:14px}
.panel-head{padding:15px 17px;border-bottom:.5px solid var(--hair);font-size:16px;color:var(--text);
  font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head span{color:var(--dim);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--elev);text-align:left;padding:10px 14px;font-size:11px;
  color:var(--dim);font-weight:500;border-bottom:.5px solid var(--hair);white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:12px 14px;border-bottom:.5px solid var(--hair);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.num{text-align:right}
.res{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;letter-spacing:.02em}
.res.won{background:rgba(48,209,88,.16);color:var(--green)}
.res.lost{background:rgba(255,69,58,.16);color:var(--red)}
.res.open{background:rgba(10,132,255,.16);color:var(--blue)}
.lead{font-size:11px;color:var(--dim)}
.empty{padding:48px var(--pad);text-align:center;color:var(--dim);font-size:13px}
.spin{display:inline-block;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="topbar">
  <div>
    <div class="brand">SPORTSAI</div>
    <div class="logo">📜 Verified Record</div>
    <div class="logo-sub">
      SINCE SEPT 10, 2026 · EVERY PICK PUBLISHED BEFORE FIRST PITCH ·
      <!-- stamped by the deploy; keep on its own line -->
      <span id="buildsha">5f17338</span>
    </div>
  </div>
  <div class="controls">
    <a class="navlink" href="./">⚾ Two BAIgger</a>
    <a class="navlink" href="gridiron.html">🏈 PlAIybook</a>
    <a class="navlink" href="hairdwood.html">🏀 HAIrdwood</a>
  </div>
</div>
<div class="wrap" id="body"><div class="empty"><span class="spin">⟳</span> Loading the ledger…</div></div>

<!-- The ladder's cycle standing is replayed here with the same engine the board
     and the alerter use, so a backfilled rung moves this page without anyone
     having to remember to rewrite the stored state. If it fails to load the
     section falls back to that stored state, which is correct but can lag. -->
<script src="dd-model.js"></script>

<script>
// ── where this record starts, and why it says so ───────────────────────────
// This page reports the current model only. Everything before 2026-09-11 ran
// under a materially different system — slate-wide boards that locked games
// before lineups posted and tracked doubles the model itself priced negative
// — and is not shown, not averaged in, and not counted.
//
// What IS shown is the start date, prominently. A track record that does not
// say when it starts is indistinguishable from one that starts wherever the
// numbers look best, and a buyer who cannot answer "since when?" is right not
// to trust it. Naming the date, and naming the rebuild that caused it, is the
// stronger position: it is specific, it is checkable against the repo's own
// history, and it is what an honest vendor does.
// ── the opening window, recovered from the repository's own history ────────
// The per-bet ledger only started on 2026-09-15. For the slates between the
// model going in and that date, no row-by-row record was ever written — but
// the nightly calibration commits carry a cumulative counter and a date, so
// the window's totals can be recovered by differencing two dated commits.
// data/era-open.json holds that difference, produced by
// scripts/derive-era-record.mjs, which refuses to emit unless doubles x 2
// equals graded legs.
//
// It is published with both commit hashes and labelled for what it is:
// aggregate only, no individual bets, weaker than the ledger that follows it.
// Presenting it as though it were the same grade of evidence would be the
// exact dishonesty this page exists to avoid.
function renderOpening(O){
  if(!O || !O.derived || !O.derived.bets) return "";
  const d=O.derived, wr=d.w/d.bets, act=d.hits/d.legs, pred=d.predicted/d.legs;
  const se=Math.sqrt(pred*(1-pred)/d.legs), z=(act-pred)/se;
  // A win rate only means money against a price, so show the prices rather
  // than pick one: at these numbers the bet is profitable at some and not at
  // others, and which one you actually get is the whole question.
  const at=a=>{const dc=a>0?1+a/100:1+100/Math.abs(a);return {a,be:1/dc,u:d.w*(dc-1)-d.l};};
  const grid=[100,-120,-150,-175].map(at);
  return `
    <div class="group-h"><span>Opening window · ${O.eraStart} to ${O.to.through}</span>
      <small>recovered from dated commits — totals only, no individual bets</small></div>
    <div class="hero">
      <div class="stat"><div class="v">${d.w}-${d.l}</div><div class="l">Record · ${d.bets} doubles</div></div>
      <div class="stat"><div class="v" style="color:var(--blue)">${(wr*100).toFixed(1)}%</div><div class="l">Doubles won</div></div>
      <div class="stat"><div class="v">${(act*100).toFixed(1)}%</div><div class="l">Legs hit · ${d.hits} of ${d.legs}</div></div>
      <div class="stat"><div class="v" style="color:var(--dim)">${(pred*100).toFixed(1)}%</div><div class="l">Legs predicted</div></div>
    </div>
    <div class="note">
      <b>A win rate is not a result until you name the price.</b> ${(wr*100).toFixed(1)}% is above breakeven at some
      prices and below it at others, and which one your book actually offered is the entire question:
      <table class="mini"><tbody>${grid.map(g=>`<tr>
        <td>${g.a>0?"+":""}${g.a}</td>
        <td class="num" style="color:var(--dim)">needs ${(g.be*100).toFixed(1)}%</td>
        <td class="num" style="color:${g.u>0?"var(--green)":"var(--red)"}">${g.u>=0?"+":""}${g.u.toFixed(2)}u</td>
      </tr>`).join("")}</tbody></table>
      At the -150 to -175 the two-leg double is really offered at, this window <b>lost money</b>. It only profits
      near even money. That is the finding, and it is the reason the board now prices single hit props alongside
      the double.<br>
      <b>The model itself was close to right.</b> Legs landed ${(act*100).toFixed(1)}% against ${(pred*100).toFixed(1)}%
      predicted across ${d.legs} graded legs — z = ${z.toFixed(2)}, comfortably inside the noise, so this neither
      proves nor refutes an edge. It says the probabilities are not obviously wrong, which is a different and much
      smaller claim.
    </div>
    <div class="note">
      <b>How to check this yourself.</b> It is the difference between two commits of
      <a href="https://github.com/thedifference7717-sys/oracle/commits/main/data/model-log.json">data/model-log.json</a>:
      <code>${O.from.sha}</code> (${O.from.committed.slice(0,10)}, counting through ${O.from.through}) subtracted from
      <code>${O.to.sha}</code> (${O.to.committed.slice(0,10)}, through ${O.to.through}). Both are timestamped by GitHub.
      <code>scripts/derive-era-record.mjs</code> reproduces it and refuses to publish unless ${d.bets} doubles × 2
      equals the ${d.legs} legs graded — which it does exactly.<br>
      <b>What it is not.</b> Individual bets for this window cannot be shown, because they were never recorded
      row by row. This is weaker evidence than the ledger below and is kept separate from it for that reason.
      Nothing here is combined into a single headline number.
    </div>`;
}

// ── The Ladder ─────────────────────────────────────────────────────────────
// The record page was built before the ladder existed and was never taught to
// read data/ladder.json, so the one bet that actually runs every single day
// has had no section here at all. The doubles ledger it does read only gains a
// row when a game clears the soft-arm bar, which on most slates is nothing —
// hence a record that looked frozen while the ladder was betting daily.
//
// Shown separately from the doubles for the same reason PlAIybook is: a
// compounding single-leg rung and a two-man parlay share neither a stake nor a
// price, and one combined figure would describe neither.
function renderLadder(K, first){
  if(!K||!Array.isArray(K.bets)||!K.bets.length)return "";
  const rows=K.bets.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const settled=rows.filter(b=>b.status==="won"||b.status==="lost");
  const w=settled.filter(b=>b.status==="won").length, l=settled.length-w;
  const open=rows.filter(b=>b.status==="open").length;
  const st=K.state||{};
  // Replay the published rows so the cycle standing here cannot drift from the
  // board's — same engine, same input.
  let live=null; try{ live=(window.DDModel||null)&&window.DDModel.ladder(K.bets,{account:(K.cfg&&K.cfg.account)||100}); }catch(e){}
  const cyc=live?live.cycle:st.cycle, base=live?live.base:st.base;
  const acct=live?live.account:st.account, pl=live?live.pl:st.pl;
  // The alerter writes its own standing into the file; this page replays the
  // same rows with the same engine. They are two computations of one number,
  // so they can only disagree if a row changed after the alerter last wrote,
  // or if something is corrupt. Either way the reader should be told rather
  // than shown whichever one happens to win. No false positives are possible:
  // identical inputs through identical code agree by construction.
  const drift = (live && st && st.account != null && Math.abs(live.account - st.account) > 0.005)
    ? `<div class="note" style="border-color:#FFD60A55"><b>These rows and the alerter's own stored total disagree.</b>
        Replaying the rungs below gives ${money(live.account)}; the figure the alerter last wrote is ${money(st.account)}.
        The replay is what is shown above, because it is derived from the rows you can see. The gap means a row was
        corrected after the alerter last published, and it closes on the next run.</div>` : "";
  const res=b=>b.status==="won"?'<span class="res won">WON</span>'
            :b.status==="lost"?'<span class="res lost">LOST</span>'
            :b.status==="open"?'<span class="res open">OPEN</span>'
            :`<span class="res">${esc(String(b.status||"—").toUpperCase())}</span>`;
  return `
    <div class="group-h"${first?' style="border-top:0;margin-top:0;padding-top:8px"':""}><span>The Ladder · one bet a day</span>
      <small>a single "to record a hit" leg, compounded — tracked apart from the doubles, which share neither its stake nor its price</small></div>
    <div class="hero">
      <div class="stat"><div class="v" style="color:${(pl||0)>=0?"var(--green)":"var(--red)"}">${money(acct||0)}</div><div class="l">Account</div></div>
      <div class="stat"><div class="v" style="color:${(pl||0)>=0?"var(--green)":"var(--red)"}">${(pl||0)>=0?"+":""}${money(pl||0)}</div><div class="l">P&amp;L</div></div>
      <div class="stat"><div class="v">${w}-${l}</div><div class="l">Rungs won–lost${open?` · ${open} open`:""}</div></div>
      <div class="stat"><div class="v">${cyc||1}</div><div class="l">Cycle · seed ${money(base||0)}</div></div>
    </div>
    ${drift}
    <div class="note">
      <b>Read this by the cycle, not the rung.</b> A rung losing is not the system losing money five times over —
      only a cycle's seed is at stake, so a miss on day four costs exactly what a miss on day one costs. What
      compounds against you is the escalation: every busted cycle restarts 25&#37; bigger, which is why the seed
      above is the number to watch rather than the win-loss line.
      ${settled.length<20?`<br><b>${settled.length} settled rung${settled.length===1?"":"s"} is far too few to mean anything.</b> This is a log, not evidence.`:""}
    </div>
    <div class="panel">
      <div class="panel-head">Every rung <span>${settled.length} settled${open?` · ${open} open`:""}</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>RESULT</th><th>DATE</th><th>PICK</th><th>GAME</th>
          <th class="num">STAKE</th><th class="num">PRICE</th><th class="num">HITS</th></tr></thead>
        <tbody>${rows.map(b=>`<tr>
          <td>${res(b)}</td>
          <td style="color:var(--dim)">${esc(b.date||"—")}</td>
          <td>${esc(b.pick||"—")}${b.backfilled?' <span class="res" style="background:rgba(255,214,10,.16);color:var(--yellow)">BACKFILLED</span>':""}</td>
          <td style="font-size:12px;color:var(--muted)">${esc(b.teams||"—")}${b.pos?` · ${esc(b.pos)}`:""}</td>
          <td class="num">${b.stake!=null?money(b.stake):"—"}</td>
          <td class="num odds">${b.price!=null?(b.price>0?"+":"")+b.price:"—"}</td>
          <td class="num">${b.hits!=null?b.hits+(b.ab!=null?`/${b.ab}`:""):"—"}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
}

// ── PlAIybook, kept separate on purpose ────────────────────────────────────
// A different sport, a different bet and a different price range. Blending an
// NFL two-leg prop parlay at +200 into an MLB hit double at -160 would produce
// a single number that describes neither: the units are not comparable, the
// hit rates are not comparable, and a good week in one would paper over a bad
// one in the other. So it gets its own block, its own totals, and no combined
// figure anywhere on this page.
function renderGridiron(G){
  if(!G || !G.record || !G.record.n) return "";
  const R=G.record, weeks=Object.entries(G.weeks||{}).sort((a,b)=>b[0].localeCompare(a[0]));
  const picks=weeks.flatMap(([k,w])=>(w.picks||[]).map(p=>({...p,wk:k})));
  const settled=picks.filter(p=>p.result===0||p.result===1);
  const roi=settled.length?R.units/settled.length:0;
  // Expected wins comes from the model's own probabilities. Comparing it to
  // actual wins is the only calibration check a sample this small supports.
  const exp=weeks.reduce((t,[,w])=>t+(w.expectedWins||0),0);
  const row=p=>{
    const won=p.result===1;
    const ret=won?p.stakeUnits?p.stakeUnits*decU(p.price):decU(p.price):0;
    return `<tr>
      <td><span class="res ${won?"won":"lost"}">${won?"WON":"LOST"}</span></td>
      <td>${p.game}<div class="lead">${(p.date||"").slice(0,10)}</div></td>
      <td>${(p.legs||[]).map(l=>`<div>${l.player} <span class="lead">${l.market} ${l.side} ${l.line}${l.got!=null?` · got ${l.got}`:""}</span></div>`).join("")}</td>
      <td class="num odds">${p.price>0?"+":""}${p.price}</td>
      <td class="num">${(p.prob*100).toFixed(1)}%</td>
      <td class="num" style="color:${p.edge>0?"var(--green)":"var(--red)"}">${p.edge>=0?"+":""}${(p.edge*100).toFixed(1)}</td>
      <td class="num" style="color:${won?"var(--green)":"var(--red)"}">${won?"+"+(decU(p.price)-1).toFixed(2):"-1.00"}u</td>
    </tr>`;
  };
  return `
    <div class="group-h"><span>PlAIybook · NFL</span><small>2-leg same-game prop parlay — a different bet, tracked separately and never combined with the baseball numbers</small></div>
    <div class="hero">
      <div class="stat"><div class="v" style="color:${R.units>=0?"var(--green)":"var(--red)"}">${R.units>=0?"+":""}${R.units.toFixed(2)}u</div><div class="l">Units won</div></div>
      <div class="stat"><div class="v">${R.w}-${R.l}${R.push?"-"+R.push:""}</div><div class="l">Record</div></div>
      <div class="stat"><div class="v" style="color:${roi>=0?"var(--green)":"var(--red)"}">${roi>=0?"+":""}${(roi*100).toFixed(1)}%</div><div class="l">Return per unit staked</div></div>
      <div class="stat"><div class="v">${R.w} <span style="color:var(--dim);font-size:17px">vs ${exp.toFixed(1)}</span></div><div class="l">Wins vs model expected</div></div>
    </div>
    <div class="note">
      <b>Read this one by the units, not the record.</b> ${R.w}-${R.l} looks like a losing week and the ledger is
      ${R.units>=0?`up ${R.units.toFixed(2)} units`:`down ${Math.abs(R.units).toFixed(2)} units`} — both are true, because these are
      plus-money parlays where one winner at a long price pays for several losers. Of the ${R.w} that landed,
      the two longest were priced at +336 and +397, and they are where the profit came from. A version of this
      week where those two miss and two short prices hit instead shows the same record and loses money.<br>
      <b>The frequency check is the honest one.</b> The model expected ${exp.toFixed(2)} winners from these
      ${settled.length} parlays and got ${R.w}. That is the number worth watching, and ${settled.length} picks
      is nowhere near enough of them to conclude anything yet.
    </div>
    <div class="panel">
      <div class="panel-head">Every NFL pick <span>${settled.length} settled · ${weeks.length} week${weeks.length===1?"":"s"}</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>RESULT</th><th>GAME</th><th>THE PARLAY</th>
          <th class="num">PRICE</th><th class="num">MODEL</th><th class="num">EDGE</th><th class="num">UNITS</th></tr></thead>

}
const decU=a=>a>0?1+a/100:1+100/Math.abs(a);

// ── the era boundary ────────────────────────────────────────────────────────

// pitch on a confirmed lineup — merged 2026-09-09T23:41Z, so 2026-09-10 is the
// first slate run entirely under it, and that is where this record starts. Everything before that was a materially different
// system: slate-wide boards that locked games before lineups posted and
// tracked negative-edge doubles. Averaging the two measures neither.
//
// The earlier bets are NOT restated here as though they were logged properly.
// They were only ever kept as a cumulative win/loss count, so they cannot be
// shown row by row and nobody can check them. They are reported separately,
// by subtraction, and labelled as what they are.
const ERA_START = "2026-09-10";
// What the era note may and may not say: it describes the whole window, so it
// can only name what held across all of it. The selection bar itself moved
// inside the window — doubles were gated on a +2pt edge and are now gated on
// the soft-arm score alone — so naming either bar here would misdescribe half
// the rows. Name what did not change, and say the bar moved.
const ERA_NOTE  = "per-game model · confirmed lineups · every pick committed before first pitch";

const $=id=>document.getElementById(id);
const pct=v=>(v*100).toFixed(1)+"%";
const money=v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const dec=a=>a>0?1+a/100:1+100/Math.abs(a);
// Sort key for a bet: its publication time where it has one, its slate date
// otherwise. A recovered row has no publication time and still belongs on its
// own day rather than at the end of the table.
//
// The id tiebreak is not decoration. Recovered rows carry no publication time,
// so every row from the same day shares a key. Array.sort is stable, which
// means ties keep insertion order in BOTH directions — reversing the
// comparator does not reverse tied rows. The table renders newest-first while
// the running balance accumulates oldest-first, so those two orders stopped
// being reverses of each other and the BALANCE column appeared to jump around:
// 9/18 read -$86.36 above -$72.79, as if the balance rose going back in time.
// Appending the id makes the key unique, so the two orders are exact reverses
// and the column reads straight down.
const ord=b=>String((b&&b.published)||(b&&b.date)||"")+"|"+String((b&&b.id)||"");
const fmtT=s=>{if(s==null||s==="")return "—";const d=new Date(s);if(isNaN(d))return "—";
  try{return d.toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch(e){return String(s);}};

// Dollars actually risked and returned. A flat unit per bet hides the thing
// that decides whether this makes money: stakes scale with edge, so a +7pt bet
// risks three and a half times what a +2pt bet does, and one of those losing
// is not the same event as the other. Stake comes from the bet's own recorded
// value wherever present, never recomputed from today's rate.
const DEFAULT_RATE = 2.50;
const stakeOf = b => b.stake != null ? +b.stake
  : Math.max(0, +((b.edge||0)*100).toFixed(1)) * (b.stakeRate || DEFAULT_RATE);
function cash(bets){
  const done=bets.filter(b=>b.status==="won"||b.status==="lost")
                 .sort((a,b)=>ord(a).localeCompare(ord(b)));
  let pnl=0, staked=0, peak=0, maxDD=0, run=[];
  let best=null, worst=null;
  for(const b of done){
    const st=stakeOf(b);
    const ret=b.status==="won" ? st*(dec(b.price)-1) : -st;
    pnl+=ret; staked+=st;
    peak=Math.max(peak,pnl); maxDD=Math.max(maxDD,peak-pnl);
    if(best==null||ret>best.ret) best={b,ret};
    if(worst==null||ret<worst.ret) worst={b,ret};
    run.push({id:b.id,bal:pnl});
  }
  const bal=Object.fromEntries(run.map(r=>[r.id,r.bal]));
  // Is scaling stakes by edge actually helping? Replay the same bets with the
  // same total money risked, spread evenly, and compare. Scaling should win:
  // it puts the bigger stakes on the higher-probability bets. If this ever
  // goes the other way over a real sample, the staking rule is the problem,
  // not the model.
  const flatStake = done.length ? staked/done.length : 0;
  let flatPnl = 0;
  for(const b of done) flatPnl += b.status==="won" ? flatStake*(dec(b.price)-1) : -flatStake;
  return {done,pnl,staked,roi:staked?pnl/staked:0,avg:flatStake,
          best,worst,maxDD,bal,flatPnl,flatStake};
}

function stats(bets){
  const done=bets.filter(b=>b.status==="won"||b.status==="lost");
  const w=done.filter(b=>b.status==="won").length, l=done.length-w;
  // Flat one unit per bet, paid at the price that was published with it.
  let pnl=0; done.forEach(b=>{pnl += b.status==="won" ? dec(b.price)-1 : -1;});
  const roi=done.length?pnl/done.length:0;
  // Did the legs land as often as the model said they would?
  const legs=done.flatMap(b=>b.legs.map((L,i)=>({p:L.p,hit:(b.hits&&b.hits[i]>=1)?1:0})));
  const n=legs.length, predL=n?legs.reduce((a,x)=>a+x.p,0)/n:0, actL=n?legs.reduce((a,x)=>a+x.hit,0)/n:0;
  const se=n?Math.sqrt(predL*(1-predL)/n):0, z=se?(actL-predL)/se:0;
  // How far off could the observed win rate be by luck alone?
  const pw=done.length?w/done.length:0;
  const seW=done.length?Math.sqrt(pw*(1-pw)/done.length):0;
  return {done,w,l,pnl,roi,n,predL,actL,se,z,seW,pw,open:bets.filter(b=>b.status==="open").length};
}

function render(L, G, O, H, B, K){

      <table class="mini">
        <thead><tr><th style="text-align:left">GRADE</th><th class="num">n</th><th class="num">SAID</th><th class="num">DID</th></tr></thead>
        <tbody>${g.map(x => `<tr>
          <td><b>${x.key}</b></td>
          <td class="num" style="color:var(--dim)">${x.n}</td>
          <td class="num" style="color:var(--muted)">${(x.predicted * 100).toFixed(1)}%</td>
          <td class="num"><b>${(x.actual * 100).toFixed(1)}%</b>
            <span style="color:${Math.abs(x.edge) <= 0.04 ? "var(--green)" : "var(--red)"};font-size:11px"> ${x.edge >= 0 ? "+" : ""}${(x.edge * 100).toFixed(1)}</span></td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="note">
      <b>This is a backtest, not a record.</b> It walked ${B.slates} slates of the ${B.season - 1}-${String(B.season).slice(2)} season and
      settled every prop the board would have published, off the real box scores. Each player's line was rebuilt
      from his own game log using only games that had already been played, so the projection could not see the
      future — but the TEAM splits are full-season, so pace and the opponent's allowance know a little that they
      should not. Both are clamped to about a tenth either way, which bounds it without hiding it. Injury reports
      come back empty on finished games, so the test ran blind to who was out; the live board knows more than this
      one did.<br>
      <b>What to look at.</b> Not the profit — the two right-hand columns. A grade is worth having only if the
      higher buckets cash more often than the lower ones, and if what the model said matches what happened.
      ${B.ladder && B.ladder.played ? `The ladder itself went ${B.ladder.won}-${B.ladder.lost}${B.ladder.void ? "-" + B.ladder.void : ""} over ${B.ladder.played} rungs on that season, passing ${B.ladder.passed} days.` : ""}
    </div>`;
}
// The ladder replay, kept to what this page needs: the record engine is in
// hairdwood-model.js and this page does not load it, so rather than a second
// copy of the maths drifting from the first, only the parts a record shows are
// computed here — and any disagreement with the board is visible, because both
// read the same file.
function M_ladder(bets) {
  const C = { account: 100, seed: 10, basePct: 0.10, rungs: 5, missGain: 0.25 };
  let account = C.account, base = C.seed, stake = C.seed, rung = 1;
  let peak = account, maxDD = 0, cycles = { done: 0, busted: 0 };
  for (const b of bets) {
    const dec = b.price > 0 ? 1 + b.price / 100 : 1 + 100 / Math.abs(b.price || 100);
    if (b.status === "won") {
      const ret = Math.round(stake * dec * 100) / 100;
      if (rung >= C.rungs) { account = Math.round((account + (ret - base)) * 100) / 100; cycles.done++; rung = 1; base = Math.round(Math.max(0, account) * C.basePct * 100) / 100; stake = base; }
      else { rung++; stake = ret; }
    } else if (b.status === "lost") {
      account = Math.round((account - base) * 100) / 100; cycles.busted++;
      rung = 1; base = Math.round(base * (1 + C.missGain) * 100) / 100; stake = base;
    } else continue;
    peak = Math.max(peak, account);
    maxDD = Math.max(maxDD, peak - account);
  }
  return { account, pl: Math.round((account - C.account) * 100) / 100, cycles, maxDD };
}
