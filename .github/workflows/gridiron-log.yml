# Grade the football board's own picks and publish the record.
#
# The twin of parlaiy-alerts.yml, and it exists for the same reason: a board
# that recommends bets and never writes down how they did is not keeping score.
# Until this ran, a week could go by with fourteen doubles posted and no trace
# of any of them — the dashboard's MY BETS panel only ever held what the user
# personally pressed LOG on.
#
# Tuesday morning, once Monday night is final and the box scores have settled.
name: Grade the GridAIron board

on:
  schedule:
    - cron: "0 13 * * 2"        # Tuesday 13:00 UTC, after Monday night
  workflow_dispatch:
    inputs:
      season:
        description: "Season to grade (blank = the current one)"
        required: false
      week:
        description: "Week to grade (blank = the current one)"
        required: false
      snapshot:
        description: "Price snapshot: a git sha, a path, or blank for the committed one"
        required: false

permissions:
  contents: write

concurrency:
  group: gridiron-log
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0         # the grader can price off a historical snapshot

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Grade the week
        run: |
          node scripts/gridiron-log.mjs \
            "${{ github.event.inputs.season }}" \
            "${{ github.event.inputs.week }}" \
            "${{ github.event.inputs.snapshot }}"

      - name: Publish the record
        run: |
          [ -f data/gridiron-log.json ] || { echo "nothing to publish"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gridiron-log.json
          git diff --cached --quiet && { echo "record unchanged"; exit 0; }
          git commit -m "Grade the board: week record"
          git push origin main
