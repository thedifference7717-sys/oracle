# What the cross-sport ladder would pick right now — MLB, NBA and NFL — without
# placing, publishing or alerting anything. A preview of a lock, run where the
# sports feeds and Kalshi are reachable.
name: Ladder scan (dry run)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Slate day YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      watch:
        description: "Players to report on, comma-separated (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan every sport
        env:
          WATCH: ${{ github.event.inputs.watch }}
        run: node scripts/ladder-scan.mjs ${{ github.event.inputs.day }} 2>&1 | tee scan.log
      - name: Summarise
        if: always()
        run: |
          { echo "## Ladder scan"; echo; echo '```'; cat scan.log | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The real alerter, end to end, with the clock ignored and nothing sent:
      # DRY_RUN prints each Telegram message instead, and this job cannot push.
      - name: Alerter dry run (forced lock, nothing sent or published)
        if: always()
        env:
          DRY_RUN: "1"
          LADDER_FORCE_LOCK: "1"
        run: |
          rm -f state.json
          node scripts/parlaiy-alerts.mjs 2>&1 | grep -v "^game [0-9]" | tail -80
          echo "--- the row it would publish ---"
          node -e 'const L=require("./data/ladder.json");const b=L.bets[L.bets.length-1];console.log(JSON.stringify(b,null,1));console.log("next:",JSON.stringify(L.next))'
          for f in dub robin; do echo "--- $f ---"; node -e 'const fs=require("fs");const f=process.argv[1];if(!fs.existsSync(f)){console.log("(none written)");process.exit(0)}const J=JSON.parse(fs.readFileSync(f,"utf8"));console.log(JSON.stringify(J.bets[J.bets.length-1],null,1).slice(0,2500))' data/$f.json; done
