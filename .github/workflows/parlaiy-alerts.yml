name: Prop Shop alerts

# The live alerter: Ladder, Dub and Robin, around the clock.
#
# The workflow lives in this public repo because GitHub's machines are free
# to run here and MLB's API answers them reliably (it throttles our own
# server hard). The CODE does not live here: each run checks the private
# prop-shop-engine repo out with ENGINE_TOKEN, a token that can reach only
# that repo, so the model exists on GitHub's temporary machine only while the
# run lasts. Two checkouts:
#
#   public/   this repo: the sealed record the site reads (ladder, dub,
#             robin, fills), pushed with this run's own token
#   engine/   the models and the alerter; its private data (the calibration
#             log, the doubles ledger) is pushed back there
#
# Logs of a public repo are public, so the alerter logs nothing here (see
# parlaiy-alerts.mjs), and this file echoes nothing that names a pick.
# The state (state.json, encrypted with PICKS_KEY) rides the Actions cache.

on:
  schedule:
    # Weak fallback seed only — GitHub drops most scheduled runs during US peak
    # hours; the six-hour loop below is what gives coverage.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parlaiy-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout the public record
        uses: actions/checkout@v4
        with:
          ref: main
          path: public

      - name: Checkout the engine (private)
        uses: actions/checkout@v4
        with:
          repository: thedifference7717-sys/prop-shop-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: parlaiy-state-${{ github.run_id }}
          restore-keys: |
            parlaiy-state-

      - name: Run alerts loop
        run: |
          END=$(( $(date +%s) + 350*60 ))
          export PUBLIC_DIR="$GITHUB_WORKSPACE/public" STATE_FILE="$GITHUB_WORKSPACE/state.json"
          for d in public engine; do
            git -C "$d" config user.name  "prop-shop-bot"
            git -C "$d" config user.email "noreply@users.noreply.github.com"
          done
          # Commit and push one checkout's data/. A pick is only verifiable if
          # its commit predates first pitch, so this runs every pass; it pushes
          # whenever HEAD is ahead of origin (so a failed push is retried next
          # pass), and never leaves a rebase half-done, which would block every
          # later pass (2026-09-22).
          push_data() {
            local dir="$1" what="$2"
            git -C "$dir" add -A data 2>/dev/null || true
            git -C "$dir" diff --cached --quiet -- data || git -C "$dir" commit -q -m "Prop Shop: publish picks and results" || true
            git -C "$dir" fetch -q origin main 2>/dev/null || true
            [ -z "$(git -C "$dir" rev-list origin/main..HEAD 2>/dev/null)" ] && return 0
            for k in 1 2 3; do
              if git -C "$dir" pull --rebase --autostash -q origin main >/tmp/pub.log 2>&1 \
                && git -C "$dir" push -q origin HEAD:main >>/tmp/pub.log 2>&1; then echo "published $what"; return 0; fi
              if [ -d "$dir/.git/rebase-merge" ] || [ -d "$dir/.git/rebase-apply" ]; then
                echo "$what: rebase stopped on a conflict — aborting it"; git -C "$dir" rebase --abort >/dev/null 2>&1 || true
              fi
              sleep $((k*3))
            done
            echo "could not push $what this pass, will retry next pass"
          }
          cd engine
          while :; do
            # Newest engine code each pass, so a fix is live within a minute.
            if git fetch -q origin main 2>/dev/null; then
              git restore --source=FETCH_HEAD --worktree -- scripts dd-model.js hairdwood-model.js gridiron-model.js ladder-select.js dub-stake.js fills.js ladder-math.js 2>/dev/null || true
              LIVE=$(git rev-parse --short FETCH_HEAD || echo unknown)
              if [ "$LIVE" != "${LAST:-}" ]; then echo "engine now at $LIVE"; LAST=$LIVE; fi
            fi
            git -C "$PUBLIC_DIR" fetch -q origin main 2>/dev/null || true
            node scripts/parlaiy-alerts.mjs || echo "alerter pass failed"
            push_data "$PUBLIC_DIR" "the public record"
            push_data "." "private data"
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 60
          done
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Seals each Ladder, Dub and Robin pick until its game starts
          # (engine/scripts/seal.mjs), and encrypts the state.
          PICKS_KEY: ${{ secrets.PICKS_KEY }}
          # Client channels by tier (engine/scripts/tiers.mjs).
          TG_TIER1: ${{ vars.TG_TIER1 }}
          TG_TIER2: ${{ vars.TG_TIER2 }}
          TG_TIER3: ${{ vars.TG_TIER3 }}
          TG_CLIENT_DELAY_MIN: ${{ vars.TG_CLIENT_DELAY_MIN || '0' }}
          # The free public channel: the daily sealed and results posts.
          TG_PUBLIC: ${{ vars.TG_PUBLIC }}
          DD_PRICE: ${{ vars.DD_PRICE || '-175' }}
          DD_MIN_EDGE: ${{ vars.DD_MIN_EDGE || '0.02' }}
          DD_PER_SPOT_PT: ${{ vars.DD_PER_SPOT_PT || vars.DD_PER_EDGE_PT || '2.50' }}
          DD_LEG_PRICE: ${{ vars.DD_LEG_PRICE || '-275' }}
          DD_MIN_SOFT: ${{ vars.DD_MIN_SOFT || '0.049' }}

      - name: Save alert state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: parlaiy-state-${{ github.run_id }}-${{ github.run_attempt }}
