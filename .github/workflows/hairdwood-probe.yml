# Check the HAIrdwood engine against the real ESPN feed.
#
# hairdwood-model.js was written in a sandbox that blocks *.espn.com at the
# network policy, so every field name in it is INFERRED from the patterns
# gridiron-model.js already uses rather than observed. Inferred field names fail
# silently — `avgMinutes` spelt wrong does not throw, it returns zero minutes
# for every player in the league — and the board that comes out looks plausible
# and is worthless.
#
# A runner can reach ESPN. So the probe runs here, against a real past slate
# with real box scores, and the job goes RED if the pipeline this repo ships
# cannot read the feed as it actually is. The report is committed either way,
# because a failure is exactly the thing worth reading.
#
# It runs on push while the board is being built (the fastest loop for fixing
# what it finds), weekly once it is quiet, and on demand.
name: Probe the HAIrdwood feed

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "hairdwood-model.js"
      - "scripts/hairdwood-probe.mjs"
      - ".github/workflows/hairdwood-probe.yml"
  schedule:
    - cron: "0 15 * * 1"        # Monday 15:00 UTC — catches ESPN changing under us
  workflow_dispatch:
    inputs:
      day:
        description: "Slate to probe, YYYY-MM-DD (blank = a default mid-season date)"
        required: false

permissions:
  contents: write

concurrency:
  group: hairdwood-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The probe exits non-zero when a check fails, and the report is the
      # point, so the exit code is carried past the commit rather than being
      # allowed to skip it.
      - name: Probe
        id: probe
        continue-on-error: true
        run: |
          set +e
          node scripts/hairdwood-probe.mjs "${{ github.event.inputs.day }}" 2>&1 | tee probe.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## HAIrdwood feed probe"
            echo
            echo '```'
            grep -E '^(PASS|WARN|FAIL)' probe.log || echo "the probe produced no checks — it fell over early"
            echo '```'
            echo
            if [ -f data/hairdwood-probe.json ]; then
              echo "**Verdict:** $(node -e 'console.log(require("./data/hairdwood-probe.json").verdict)')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report
        if: always()
        run: |
          [ -f data/hairdwood-probe.json ] || { echo "no report to commit"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hairdwood-probe.json
          git diff --cached --quiet && { echo "report unchanged"; exit 0; }
          git commit -m "Probe the HAIrdwood feed: $(node -e 'const r=require("./data/hairdwood-probe.json");console.log(r.failed?r.failed+" check(s) failing":"all checks passing")')"
          # A publish step races anyone pushing to the same branch, and losing that
          # race failed the whole job on a run whose actual work had succeeded —
          # the numbers were computed, printed and then thrown away. Rebase onto
          # whatever landed while this was running; the only file this touches is
          # its own report, so there is nothing to conflict with.
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "${{ github.ref_name }}"

      - name: Fail the job if the engine cannot read the feed
        if: always() && steps.probe.outputs.code != '0'
        run: |
          echo "the probe reported failures — see the summary and data/hairdwood-probe.json"
          exit 1
