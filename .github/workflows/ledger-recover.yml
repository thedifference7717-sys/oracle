name: Recover missing ledger rows

# Hourly: puts back any doubles-ledger row the alerter holds in its state but
# whose push never landed, then audits the ledger against the calibration
# log. Both files are private now and live in prop-shop-engine; this runs
# here only because the alerter's state rides this repo's Actions cache. The
# code is checked out from the engine with ENGINE_TOKEN, as in
# parlaiy-alerts.yml, and logs nothing that names a pick.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the public record
        uses: actions/checkout@v4
        with:
          ref: main
          path: public

      - name: Checkout the engine (private)
        uses: actions/checkout@v4
        with:
          repository: thedifference7717-sys/prop-shop-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine
          fetch-depth: 0          # the audit diffs consecutive model-log commits

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore the alerter's state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: parlaiy-state-never-matches-on-purpose
          restore-keys: |
            parlaiy-state-

      - name: Reconcile and audit (output withheld; this repo's logs are public)
        working-directory: engine
        env:
          PICKS_KEY: ${{ secrets.PICKS_KEY }}
          PUBLIC_DIR: ${{ github.workspace }}/public
          STATE_FILE: ${{ github.workspace }}/state.json
        run: |
          node scripts/ledger-recover.mjs > "$RUNNER_TEMP/recover.log" 2>&1 && echo "recover: ok" || echo "recover: failed"
          node scripts/ledger-audit.mjs   > "$RUNNER_TEMP/audit.log"   2>&1 && echo "audit: ok"   || { echo "audit: the record is short"; exit 1; }

      - name: Push whatever it recovered to the engine
        if: always()
        working-directory: engine
        run: |
          git config user.name  "prop-shop-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -q -m "Prop Shop: recover ledger rows lost before they were committed"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && { echo "pushed"; exit 0; }
            echo "push failed, retry $i"; sleep $((2**i))
          done
          echo "could not push"; exit 1
