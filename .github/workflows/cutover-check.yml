# TEMPORARY — removed before merge. Proves the new two-checkout setup works
# on GitHub's machines. Sends nothing, publishes nothing, and logs only
# yes/no answers (this repo's logs are public).
name: Cutover check
on:
  push:
    branches: ["claude/prop-shop-lineup-timing-4nzhvy"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: public }
      - uses: actions/checkout@v4
        with:
          repository: thedifference7717-sys/prop-shop-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          ref: main
          path: engine
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Checks
        working-directory: engine
        env:
          PICKS_KEY: ${{ secrets.PICKS_KEY }}
          ENGINE_TOKEN_SET: ${{ secrets.ENGINE_TOKEN != '' }}
        run: |
          echo "engine checked out: $([ -f dd-model.js ] && echo yes || echo NO)"
          echo "PICKS_KEY is a valid key: $(node -e 'try{console.log(Buffer.from((process.env.PICKS_KEY||"").trim(),"base64").length===32?"yes":"NO")}catch(e){console.log("NO")}')"
          git config user.name t; git config user.email t@t
          echo "can push to the engine: $(git push --dry-run -q origin HEAD:refs/heads/cutover-check-probe >/dev/null 2>&1 && echo yes || echo NO)"
          export PUBLIC_DIR="$GITHUB_WORKSPACE/public" STATE_FILE="$RUNNER_TEMP/state.json" DRY_RUN=1 LADDER_FORCE_LOCK=1
          node scripts/parlaiy-alerts.mjs > "$RUNNER_TEMP/dry.log" 2>&1; code=$?
          echo "dry-run alerter exit code: $code"
          echo "MLB board built: $(grep -q 'props, .* eligible' "$RUNNER_TEMP/dry.log" && echo yes || echo NO)"
          echo "a Ladder alert was composed: $(grep -q 'PROP SHOP · THE LADDER' "$RUNNER_TEMP/dry.log" && echo yes || echo 'no (already placed today, or nothing qualified)')"
          echo "errors in the run: $(grep -ciE '^error|HTTP [45][0-9][0-9]' "$RUNNER_TEMP/dry.log")"
          echo "public files written under public/: $(git -C "$PUBLIC_DIR" status --short data | wc -l)"
          echo "public files written under engine/: $(git status --short data | grep -cE 'ladder|dub|robin|fills')"
