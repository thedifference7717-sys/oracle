name: Oracle Trendline tuning

# Walk-forward parameter search for trendline/ on BTCUSDT (2020 → now).
# Picks settings on 2020-09 → 2024-08 and reports them on 2024-09 → now.
on:
  workflow_dispatch:
  push:
    branches: [claude/zynalgo-trendline-indicator-fjt2mz]
    paths:
      - trendline/tune.py
      - trendline/explore.py
      - .github/workflows/trendline-tune.yml

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy numba
      - name: Month key for the data cache
        id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: trendline/btc5m.pkl
          key: btc5m-${{ steps.month.outputs.ym }}
      - name: Tune
        working-directory: trendline
        run: |
          python tune.py
          cat tune-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Explore new entry ideas
        working-directory: trendline
        run: |
          python explore.py
          cat explore-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trendline-tune
          path: |
            trendline/tune-report.md
            trendline/explore-report.md
