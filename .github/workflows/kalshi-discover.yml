# Find out what Kalshi actually lists, rather than guessing series tickers.
# Read-only and on demand: it writes nothing and commits nothing, it just
# prints what it found so the tickers can be wired by hand afterwards.
name: Discover Kalshi markets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalshi-discover
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/kalshi-discover.mjs
