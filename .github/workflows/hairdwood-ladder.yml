# Publish the HAIrdwood ladder's rung, then settle it.
#
# A board that recommends a bet a day and never writes down how it went is not
# keeping score, and a score kept in a different program from the picks is not
# a score — so the rung comes out of hairdwood-model.js, the same file the
# dashboard runs, and lands in the repo before tip-off where it is timestamped
# and cannot be quietly improved afterwards.
#
# Hourly through the basketball evening, because both halves are idempotent and
# self-healing: the lock is a no-op until an hour before the first tip and a
# no-op again once today's rung exists, and grading leaves a row open until the
# box score actually lands. A missed hour costs nothing; the next one fixes it.
name: HAIrdwood ladder

on:
  schedule:
    # 13:00 UTC catches the overnight results; 18:00-03:00 covers every tip-off
    # window the NBA uses, early Sunday games included.
    - cron: "0 13,18,19,20,21,22,23,0,1,2,3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "both (default), lock, or grade"
        required: false
        default: "both"

permissions:
  contents: write

concurrency:
  group: hairdwood-ladder
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lock and settle
        run: node scripts/hairdwood-ladder.mjs "${{ github.event.inputs.mode }}" 2>&1 | tee ladder.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## HAIrdwood ladder"
            echo
            echo '```'
            grep -E "LOCKED|PASS —|-> (WON|LOST|VOID)|ladder:|nothing changed|no slate|too early|already" ladder.log || tail -5 ladder.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hairdwood-ladder.json
          git diff --cached --quiet && { echo "record unchanged"; exit 0; }
          # The message says what actually happened, so the commit log reads as
          # the record's own history.
          git commit -m "HAIrdwood ladder: $(grep -oE 'LOCKED .*|PASS — .*|-> (WON|LOST|VOID).*' ladder.log | head -1 | cut -c1-72)"
          git push origin main
